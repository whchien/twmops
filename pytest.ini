[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Register custom markers
markers =
    unit: Unit tests (isolated, no external dependencies)
    integration: Integration tests (multiple modules, mocked external deps)
    e2e: End-to-end tests (real network calls if available)
    slow: Tests that take more than 1 second
    asyncio: Async tests

# Asyncio mode
asyncio_mode = auto

# Minimum Python version
minversion = 3.9
